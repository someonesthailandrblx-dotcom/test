<style>
:root{--ink:#13233A;--paper:#EEF3F7;--tag:#FFC53D;--red:#D6403A;--mute:#51627A;--line:#C9D5E0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 Sarabun,"Noto Sans KR",sans-serif}
h1,h2,legend,.brand{font-family:Prompt,"Noto Sans KR",sans-serif}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:760px;margin:auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font-weight:700;font-size:21px;text-decoration:none;color:inherit}
.lg button{background:none;border:1.5px solid var(--ink);color:var(--ink);padding:2px 12px;font:600 14px Sarabun;cursor:pointer}
.lg button:first-child{border-radius:999px 0 0 999px}
.lg button:last-child{border-radius:0 999px 999px 0}
.lg button+button{border-left:0}
.lg button.on{background:var(--ink);color:#fff}
h1{font-size:clamp(28px,5vw,40px);margin:28px 0 6px}
.note{color:var(--mute);font-size:15px}
fieldset{border:0;border-left:4px solid var(--tag);background:#fff;border-radius:10px;margin:22px 0;padding:8px 18px 18px}
legend{float:left;width:100%;font-size:20px;font-weight:700;padding:0;margin:0 0 12px}
legend+.g{clear:both}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{grid-column:1/-1}
label{display:grid;gap:3px;font-weight:600;font-size:15px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.chk input{width:auto;margin-top:6px}
button.go{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:13px 30px;font:500 17px Prompt,"Noto Sans KR",sans-serif;cursor:pointer;margin-top:12px}
button.go:disabled{opacity:.5}
.hp{position:absolute;left:-9999px}
.ok{background:#fff;border-radius:10px;padding:28px;text-align:center}
.code{font:700 38px Prompt;background:var(--tag);display:inline-block;padding:4px 22px;border-radius:8px;margin:6px 0}
@media (max-width:620px){.g{grid-template-columns:1fr}}
</style>
</head>

const THP='กรุงเทพมหานคร|Bangkok;เชียงใหม่|Chiang Mai;เชียงราย|Chiang Rai;ลำปาง|Lampang;ลำพูน|Lamphun;แม่ฮ่องสอน|Mae Hong Son;น่าน|Nan;พะเยา|Phayao;แพร่|Phrae;อุตรดิตถ์|Uttaradit;กาฬสินธุ์|Kalasin;ขอนแก่น|Khon Kaen;ชัยภูมิ|Chaiyaphum;นครพนม|Nakhon Phanom;นครราชสีมา|Nakhon Ratchasima;บึงกาฬ|Bueng Kan;บุรีรัมย์|Buriram;มหาสารคาม|Maha Sarakham;มุกดาหาร|Mukdahan;ยโสธร|Yasothon;ร้อยเอ็ด|Roi Et;เลย|Loei;สกลนคร|Sakon Nakhon;สุรินทร์|Surin;ศรีสะเกษ|Sisaket;หนองคาย|Nong Khai;หนองบัวลำภู|Nong Bua Lamphu;อุดรธานี|Udon Thani;อุบลราชธานี|Ubon Ratchathani;อำนาจเจริญ|Amnat Charoen;กำแพงเพชร|Kamphaeng Phet;ชัยนาท|Chai Nat;นครนายก|Nakhon Nayok;นครปฐม|Nakhon Pathom;นครสวรรค์|Nakhon Sawan;นนทบุรี|Nonthaburi;ปทุมธานี|Pathum Thani;พระนครศรีอยุธยา|Phra Nakhon Si Ayutthaya;พิจิตร|Phichit;พิษณุโลก|Phitsanulok;เพชรบูรณ์|Phetchabun;ลพบุรี|Lopburi;สมุทรปราการ|Samut Prakan;สมุทรสงคราม|Samut Songkhram;สมุทรสาคร|Samut Sakhon;สิงห์บุรี|Sing Buri;สุโขทัย|Sukhothai;สุพรรณบุรี|Suphan Buri;สระบุรี|Saraburi;อ่างทอง|Ang Thong;อุทัยธานี|Uthai Thani;จันทบุรี|Chanthaburi;ฉะเชิงเทรา|Chachoengsao;ชลบุรี|Chonburi;ตราด|Trat;ปราจีนบุรี|Prachinburi;ระยอง|Rayong;สระแก้ว|Sa Kaeo;กาญจนบุรี|Kanchanaburi;ตาก|Tak;ประจวบคีรีขันธ์|Prachuap Khiri Khan;เพชรบุรี|Phetchaburi;ราชบุรี|Ratchaburi;กระบี่|Krabi;ชุมพร|Chumphon;ตรัง|Trang;นครศรีธรรมราช|Nakhon Si Thammarat;นราธิวาส|Narathiwat;ปัตตานี|Pattani;พังงา|Phang Nga;พัทลุง|Phatthalung;ภูเก็ต|Phuket;ระนอง|Ranong;สตูล|Satun;สงขลา|Songkhla;สุราษฎร์ธานี|Surat Thani;ยะลา|Yala'.split(';').map(x=>x.split('|'));

const field=(p,k,o={})=>`<label class="${o.w?'w':''}"><span><span data-k="${k}"></span>${o.o?'':' *'}</span>${o.t
 ?`<textarea name="${p}_${k}" rows="3" ${o.o?'':'required'}></textarea>`
 :`<input name="${p}_${k}" ${o.type?`type="${o.type}"`:''} ${o.a||''} ${o.o?'':'required'}>`}</label>`;
const sel=(p,k,list)=>`<label><span><span data-k="${k}"></span> *</span><select name="${p}_${k}" required><option value="" data-k="pick"></option>${list.map(([a,b])=>`<option value="${b}">${a} (${b})</option>`).join('')}</select></label>`;
const REG=window.KR_REGIONS||[];
const krProv=p=>`<label><span><span data-k="kprov"></span> *</span><select name="${p}_prov" data-kr="${p}" required><option value="" data-k="pick"></option>${REG.map(r=>`<option value="${r.ko}">${r.ko} (${r.en})</option>`).join('')}</select></label>`;
const krCity=p=>`<label><span><span data-k="city"></span> *</span><select name="${p}_city" id="${p}_city" required disabled><option value="" data-k="pickprov"></option></select></label>`;
const zip={a:'pattern="[0-9]{5}" inputmode="numeric" maxlength="5"'};

$('#f').innerHTML=`
<fieldset><legend data-k="snd"></legend><div class="g">
${field('s','fn')}${field('s','ln')}${field('s','zip',zip)}${krProv('s')}${krCity('s')}${field('s','street',{o:1})}${field('s','bno')}${field('s','place',{o:1})}${field('s','dong',{o:1})}${field('s','ho',{o:1})}${field('s','phone',{type:'tel'})}${field('s','email',{type:'email'})}
</div></fieldset>
<fieldset><legend data-k="rcv"></legend><div class="g">
${field('r','fn')}${field('r','ln')}${field('r','zip',zip)}${sel('r','prov',THP)}${field('r','addr',{t:1,w:1})}${field('r','phone',{type:'tel'})}${field('r','email',{type:'email'})}
</div></fieldset>
<fieldset><legend data-k="cus"></legend><div class="g">
${field('c','contents',{w:1})}${field('c','qty',{type:'number',a:'min="1" step="1"'})}${field('c','value',{type:'number',a:'min="0" step="any"'})}
<label><span data-k="cur"></span><select name="c_cur"><option>USD</option><option>KRW</option><option>THB</option></select></label>
</div></fieldset>
<label class="chk"><input type="checkbox" name="consent" required><span><span data-k="agree"></span> <a href="legal.html#terms" target="_blank" rel="noopener" data-k="terms"></a><span data-k="agree2"></span></span></label>
<input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="go" data-k="submit"></button>
<p class="note" data-k="safe"></p>`;

let LANG='th';
function setLang(l){
 LANG=l;document.documentElement.lang=l;
 document.querySelectorAll('[data-k]').forEach(e=>e.textContent=D[e.dataset.k][LI[l]]);
 document.title=D.title[LI[l]];
 document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 try{localStorage.setItem('lang',l)}catch(_){}
}
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let sv=null;try{sv=localStorage.getItem('lang')}catch(_){}
setLang(LI[sv]!==undefined?sv:'th');

// the district list follows the province that was picked
document.addEventListener('change',e=>{
 const p=e.target.dataset&&e.target.dataset.kr;if(!p)return;
 const r=REG.find(x=>x.ko===e.target.value),c=document.getElementById(p+'_city');
 if(!r){c.disabled=true;c.innerHTML='<option value="" data-k="pickprov"></option>'}
 else{
  const one=r.d.length===1;c.disabled=false;
  c.innerHTML=(one?'':'<option value="" data-k="pick"></option>')+r.d.map(([a,b])=>`<option value="${a}"${one?' selected':''}>${a} (${b})</option>`).join('');
 }
 setLang(LANG);
});

const pick=(d,p)=>Object.fromEntries(Object.entries(d).filter(([k])=>k.startsWith(p+'_')).map(([k,v])=>[k.slice(2),v]));
function done(code){
 $('#f').innerHTML=`<div class="ok"><h2 data-k="ok"></h2><div class="code">${code}</div><p data-k="okn"></p><p><a href="index.html" data-k="home"></a></p></div>`;
 setLang(LANG);
}
$('#f').onsubmit=async e=>{
 e.preventDefault();
 const d=Object.fromEntries(new FormData(e.target));
 if(d.website)return done('PR-000000');
 const code='PR-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
 const btn=e.target.querySelector('.go');btn.disabled=true;
 try{
  const r=await fetch(URL_+'/rest/v1/parcel_requests',{method:'POST',
   headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
   body:JSON.stringify({code,language:LANG,sender:pick(d,'s'),recipient:pick(d,'r'),customs:pick(d,'c'),consent_version:'v1',consent_at:new Date().toISOString()})});
  if(!r.ok)throw new Error(r.status);
  done(code);
 }catch(_){alert(D.err[LI[LANG]]);btn.disabled=false}
};
</script>
</div>
