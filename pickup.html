<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=Sarabun:wght@400;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#13233A;--paper:#EEF3F7;--tag:#FFC53D;--red:#D6403A;--mute:#51627A;--line:#C9D5E0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 Sarabun,"Noto Sans KR",sans-serif}
h1,h2,legend,.brand{font-family:Prompt,"Noto Sans KR",sans-serif}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:760px;margin:auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{font-weight:700;font-size:21px;text-decoration:none;color:inherit}
.lg button{background:none;border:1.5px solid var(--ink);color:var(--ink);padding:2px 12px;font:600 14px Sarabun;cursor:pointer}
.lg button:first-child{border-radius:999px 0 0 999px}
.lg button:last-child{border-radius:0 999px 999px 0}
.lg button+button{border-left:0}
.lg button.on{background:var(--ink);color:#fff}
h1{font-size:clamp(28px,5vw,40px);margin:28px 0 6px}
.note{color:var(--mute);font-size:15px}
fieldset{border:0;border-left:4px solid var(--tag);background:#fff;border-radius:10px;margin:22px 0;padding:8px 18px 18px}
legend{float:left;width:100%;font-size:20px;font-weight:700;padding:0;margin:0 0 12px}
legend+.g{clear:both}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{grid-column:1/-1}
label{display:grid;gap:3px;font-weight:600;font-size:15px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
select:disabled{background:#F2F5F8;color:var(--mute)}
.limit{background:#FFF4D6;border-left:4px solid var(--tag);padding:8px 12px;border-radius:6px;font-size:15px;margin:0 0 4px}
.price{font-weight:400;color:var(--mute);font-size:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px dashed var(--ink);padding-top:12px;margin-top:6px}
.total b{font:700 30px Prompt,sans-serif}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.chk input{width:auto;margin-top:6px}
button.go{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:13px 30px;font:500 17px Prompt,"Noto Sans KR",sans-serif;cursor:pointer;margin-top:12px}
button.go:disabled{opacity:.5}
.hp{position:absolute;left:-9999px}
.ok{background:#fff;border-radius:10px;padding:28px;text-align:center}
.code{font:700 38px Prompt;background:var(--tag);display:inline-block;padding:4px 22px;border-radius:8px;margin:6px 0}
@media (max-width:620px){.g{grid-template-columns:1fr}}
</style>
</head>

 needbox:['กรุณาเลือกกล่องอย่างน้อย 1 กล่อง','Please choose at least 1 box.','박스를 1개 이상 선택해 주세요.'],
 agree:['ฉันยอมรับ','I accept the',''],terms:['เงื่อนไขการบริการและนโยบายความเป็นส่วนตัว','terms of service and privacy policy','서비스 이용약관 및 개인정보 처리방침'],agree2:['','','에 동의합니다'],
 submit:['ส่งคำขอรับพัสดุ','Send pick-up request','수거 신청하기'],
 safe:['ข้อมูลของคุณจะถูกบันทึกอย่างปลอดภัย และเจ้าหน้าที่เท่านั้นที่เห็นได้','Your details are stored securely and only our staff can see them.','입력하신 정보는 안전하게 저장되며 담당 직원만 열람할 수 있습니다.'],
 ok:['ส่งคำขอเรียบร้อยแล้ว','Request sent','신청이 완료되었습니다'],
 okn:['กรุณาเก็บหมายเลขคำขอนี้ไว้ ทีมงานจะติดต่อกลับทางเบอร์หรืออีเมลที่ให้ไว้','Please keep this request number. We will contact you by the phone or email you gave.','접수번호를 보관해 주세요. 입력하신 연락처나 이메일로 연락드리겠습니다.'],
 err:['ส่งไม่สำเร็จ กรุณาลองใหม่อีกครั้ง','Could not send. Please try again.','제출하지 못했습니다. 다시 시도해 주세요.'],
 home:['กลับหน้าหลัก','Back to home','홈으로']
};
const REG=window.KR_REGIONS||[];
const field=(k,o={})=>`<label class="${o.w?'w':''}"><span><span data-k="${k}"></span>${o.o?'':' *'}</span><input name="${k}" ${o.type?`type="${o.type}"`:''} ${o.a||''} ${o.o?'':'required'}></label>`;
const krProv=`<label><span><span data-k="kprov"></span> *</span><select name="prov" data-kr="1" required><option value="" data-k="pick"></option>${REG.map(r=>`<option value="${r.ko}">${r.ko} (${r.en})</option>`).join('')}</select></label>`;
const krCity=`<label><span><span data-k="city"></span> *</span><select name="city" id="city" required disabled><option value="" data-k="pickprov"></option></select></label>`;
const zip={a:'pattern="[0-9]{5}" inputmode="numeric" maxlength="5"'};
const boxRow=n=>`<label><span><span data-k="box${n}"></span> <span class="price" id="pr${n}"></span></span><select name="box${n}" id="b${n}"><option>0</option></select></label>`;

$('#f').innerHTML=`
<fieldset><legend data-k="who"></legend><div class="g">
${field('fn')}${field('ln')}${field('phone',{type:'tel'})}${field('email',{type:'email'})}
</div></fieldset>
<fieldset><legend data-k="where"></legend><div class="g">
${field('zip',zip)}${krProv}${krCity}${field('street',{o:1})}${field('bno')}${field('place',{o:1})}${field('dong',{o:1})}${field('ho',{o:1})}
</div></fieldset>
<fieldset><legend data-k="boxes"></legend><div class="g">
<label class="w"><span><span data-k="date"></span> *</span><input type="date" name="pickup_date" id="pd" required></label>
<p class="limit w" data-k="limit"></p>
${boxRow(5)}${boxRow(6)}
</div>
<div class="total"><span data-k="total"></span><b id="tot"></b></div>
<p class="note" id="hint"></p>
</fieldset>
<label class="chk"><input type="checkbox" name="consent" required><span><span data-k="agree"></span> <a href="legal.html#terms" target="_blank" rel="noopener" data-k="terms"></a><span data-k="agree2"></span></span></label>
<input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="go" data-k="submit"></button>
<p class="note" data-k="safe"></p>`;

// earliest pick-up date is today in Korea; latest is one year ahead
const kst=Date.now()+9*3600e3;
$('#pd').min=new Date(kst).toISOString().slice(0,10);
$('#pd').max=new Date(kst+365*864e5).toISOString().slice(0,10);

const won=n=>'₩'+Number(n).toLocaleString('en-US');
const qty=n=>parseInt($('#b'+n).value,10)||0;
// each box type can only use what the other one leaves free of the 10-box limit
function fillOptions(){
 for(const n of [5,6]){
  const other=qty(n===5?6:5),max=MAXBOX-other,s=$('#b'+n),cur=Math.min(qty(n),max);
  s.innerHTML=Array.from({length:max+1},(_,i)=>`<option${i===cur?' selected':''}>${i}</option>`).join('');
 }
}
function render(){
 $('#pr5').textContent='· '+won(PRICE.box_no5)+' '+D.perbox[LI[LANG]];
 $('#pr6').textContent='· '+won(PRICE.box_no6)+' '+D.perbox[LI[LANG]];
 const n=qty(5)+qty(6),t=qty(5)*PRICE.box_no5+qty(6)*PRICE.box_no6;
 $('#tot').textContent=won(n?t:0);
 $('#hint').textContent=D[n?'est':'hint'][LI[LANG]];
}
fillOptions();
['b5','b6'].forEach(id=>$('#'+id).addEventListener('change',()=>{fillOptions();render()}));

let LANG='th';
function setLang(l){
 LANG=l;document.documentElement.lang=l;
 document.querySelectorAll('[data-k]').forEach(e=>e.textContent=D[e.dataset.k][LI[l]]);
 document.title=D.title[LI[l]];
 document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 try{localStorage.setItem('lang',l)}catch(_){}
 render();
}
document.querySelectorAll('#lg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let sv=null;try{sv=localStorage.getItem('lang')}catch(_){}
setLang(LI[sv]!==undefined?sv:'th');

// the district list follows the province that was picked
document.addEventListener('change',e=>{
 if(!(e.target.dataset&&e.target.dataset.kr))return;
 const r=REG.find(x=>x.ko===e.target.value),c=$('#city');
 if(!r){c.disabled=true;c.innerHTML='<option value="" data-k="pickprov"></option>'}
 else{
  const one=r.d.length===1;c.disabled=false;
  c.innerHTML=(one?'':'<option value="" data-k="pick"></option>')+r.d.map(([a,b])=>`<option value="${a}"${one?' selected':''}>${a} (${b})</option>`).join('');
 }
 setLang(LANG);
});

// live prices (staff can change them in the back-office)
fetch(URL_+'/rest/v1/prices?select=key,amount_krw',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
 .then(r=>r.ok?r.json():[]).then(rows=>{rows.forEach(x=>{if(x.key in PRICE)PRICE[x.key]=x.amount_krw});render()}).catch(()=>{});

function done(code){
 $('#f').innerHTML=`<div class="ok"><h2 data-k="ok"></h2><div class="code">${code}</div><p data-k="okn"></p><p><a href="index.html" data-k="home"></a></p></div>`;
 setLang(LANG);
}
$('#f').onsubmit=async e=>{
 e.preventDefault();
 const d=Object.fromEntries(new FormData(e.target));
 if(d.website)return done('PU-000000');
 const b5=qty(5),b6=qty(6);
 if(b5+b6<1||b5+b6>MAXBOX){alert(D.needbox[LI[LANG]]);return}
 const code='PU-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');
 const contact={};['fn','ln','phone','email','zip','prov','city','street','bno','place','dong','ho'].forEach(k=>contact[k]=d[k]||'');
 const btn=e.target.querySelector('.go');btn.disabled=true;
 try{
  const r=await fetch(URL_+'/rest/v1/pickup_requests',{method:'POST',
   headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
   // the total is not sent: the database works it out from the current prices
   body:JSON.stringify({code,language:LANG,contact,pickup_date:d.pickup_date,box5:b5,box6:b6,consent_version:'v1',consent_at:new Date().toISOString()})});
  if(!r.ok)throw new Error(r.status);
  done(code);
 }catch(_){alert(D.err[LI[LANG]]);btn.disabled=false}
};
</script>
</div>
</body>
</html>
